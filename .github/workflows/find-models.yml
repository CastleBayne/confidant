# One-off lookup: which uncensored Llama 3.2 GGUF repos exist and are public.
name: Find GGUF models
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/find-models.yml"]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r: return json.load(r)
              except Exception as e: return {"error": str(e)}
          for q in ["Llama-3.2-1B-Instruct-abliterated", "Llama-3.2-3B-Instruct-abliterated", "Llama-3.2-1B-abliterated", "Llama-3.2-3B-abliterated"]:
              res = get(f"https://huggingface.co/api/models?search={q}&filter=gguf&sort=downloads&direction=-1&limit=12")
              print(f"\n=== {q}")
              for m in res if isinstance(res, list) else []:
                  info = get(f"https://huggingface.co/api/models/{m['id']}")
                  files = [s["rfilename"] for s in info.get("siblings", []) if s["rfilename"].endswith(".gguf")]
                  q4 = [f for f in files if "q4_k_m" in f.lower()]
                  print(f"{m['id']} | dl={m.get('downloads')} | gated={info.get('gated')} | private={info.get('private')} | q4_k_m={q4[:2]}")
