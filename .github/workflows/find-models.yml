# One-off lookup: when Forge installs its CORS middleware.
name: Forge CORS 2
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/find-models.yml"]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone -q --depth 1 https://github.com/lllyasviel/stable-diffusion-webui-forge forge && cd forge
          echo "=== webui.py 95-150"; sed -n 95,150p webui.py | cut -c1-160
          echo "=== initialize_util 190-220"; sed -n 190,220p modules/initialize_util.py | cut -c1-160
          echo "=== gradio pin"; grep -in "^gradio" requirements_versions.txt
