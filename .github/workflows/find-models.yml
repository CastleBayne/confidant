# One-off lookup: uncensored 8B-12B GGUF models for running on a laptop.
name: Find GGUF models
on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/find-models.yml"]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - shell: python
        run: |
          import json, urllib.request
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r: return json.load(r)
              except Exception as e: return {"error": str(e)}
          for q in ["Meta-Llama-3.1-8B-Instruct-abliterated", "Llama-3.1-8B-Instruct-abliterated", "Rocinante-12B", "Mistral-Nemo-Instruct-2407-abliterated", "MN-12B-Mag-Mell", "Hermes-3-Llama-3.1-8B-abliterated", "gemma-2-9b-it-abliterated"]:
              res = get(f"https://huggingface.co/api/models?search={q}&filter=gguf&sort=downloads&direction=-1&limit=6")
              print(f"\n=== {q}")
              for m in res if isinstance(res, list) else []:
                  info = get(f"https://huggingface.co/api/models/{m['id']}?blobs=true")
                  files = {s["rfilename"]: s.get("size") for s in info.get("siblings", []) if s["rfilename"].endswith(".gguf")}
                  q4 = [(f, round((sz or 0) / 1e9, 2)) for f, sz in files.items() if "q4_k_m" in f.lower()]
                  print(f"{m['id']} | dl={m.get('downloads')} | gated={info.get('gated')} | q4_k_m={q4[:2]}")
