# Converts an open "abliterated" (refusal-removed) model into WebLLM's MLC
# format and publishes it on this Pages site, so the app can load it from
# its own origin. Runs when this file changes, or manually.
name: Build uncensored model

on:
  push:
    branches: [gh-pages]
    paths: [".github/workflows/build-model.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: models/Llama-3.2-1B-Instruct-abliterated-q4f16_1-MLC/resolve/main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MLC LLM
        run: |
          pip install --pre -U -f https://mlc.ai/wheels mlc-llm-nightly-cpu mlc-ai-nightly-cpu huggingface_hub
          # Runtime dependencies the nightly wheels don't always declare
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install psutil fastapi uvicorn shortuuid requests tqdm safetensors numpy ml_dtypes prompt_toolkit openai transformers sentencepiece tiktoken
          pip list 2>/dev/null | grep -i -E "mlc|tvm"
          python -c "import mlc_llm, tvm; print('mlc_llm', mlc_llm.__file__); print('tvm', tvm.__version__)"

      # Some uploads get gated or removed, so try known copies, then search.
      - name: Download source model
        shell: python
        run: |
          from huggingface_hub import HfApi, snapshot_download
          api = HfApi()
          candidates = [
              "huihui-ai/Llama-3.2-1B-Instruct-abliterated",
              "KidIkaros/Llama-3.2-1B-Instruct-abliterated",
              "mylesgoose/Llama-3.2-1B-Instruct-abliterated3",
              "mylesgoose/Llama-3.2-1B-Instruct-abliterated2",
          ]
          try:
              for m in api.list_models(search="Llama-3.2-1B-Instruct-abliterated", sort="downloads", limit=30):
                  if "gguf" not in m.id.lower() and m.id not in candidates:
                      candidates.append(m.id)
          except Exception as e:
              print("search failed:", e)
          for repo in candidates:
              try:
                  files = api.list_repo_files(repo)
                  if not any(f.endswith(".safetensors") for f in files):
                      print("skip (no safetensors):", repo)
                      continue
                  snapshot_download(repo, local_dir="src", allow_patterns=["*.json", "*.safetensors", "tokenizer*"])
                  print("USING", repo)
                  open("source.txt", "w").write(repo)
                  break
              except Exception as e:
                  print("skip", repo, type(e).__name__, str(e)[:120])
          else:
              raise SystemExit("No downloadable abliterated Llama 3.2 1B found")

      - name: Convert to MLC format
        run: |
          python -m mlc_llm convert_weight src --quantization q4f16_1 -o "$OUT"
          python -m mlc_llm gen_config src --quantization q4f16_1 --conv-template llama-3_1 \
            --context-window-size 4096 --prefill-chunk-size 1024 -o "$OUT"
          # Newer WebLLM reads tensor-cache.json; older converters write ndarray-cache.json
          if [ -f "$OUT/ndarray-cache.json" ] && [ ! -f "$OUT/tensor-cache.json" ]; then
            cp "$OUT/ndarray-cache.json" "$OUT/tensor-cache.json"
          fi
          ls -la "$OUT"
          du -sh "$OUT"

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          git commit -m "Add Llama 3.2 1B abliterated (q4f16_1, MLC) from $(cat source.txt)"
          git push
